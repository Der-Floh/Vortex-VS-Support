name: Build and Publish to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        run: npm run package

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          display_name=$(node -p "require('./package.json').displayName")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"
          echo "zip_path=dist/$name-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Verify packaged file
        shell: bash
        run: |
          test -f "${{ steps.pkg.outputs.zip_path }}"
          unzip -l "${{ steps.pkg.outputs.zip_path }}"

      - name: Check release settings
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
        run: |
          [ "$TAG" = "v$VERSION" ] || { echo "::error::The release tag $TAG doesn't match v$VERSION from package.json."; exit 1; }
          [ -n "$NEXUSMODS_API_KEY" ] || { echo "::error::The NEXUSMODS_API_KEY secret isn't set."; exit 1; }
          [ -n "$NEXUSMODS_FILE_ID" ] || { echo "::error::The NEXUSMODS_FILE_ID variable isn't set."; exit 1; }

      - name: Upload zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pkg.outputs.zip_path }}

      - name: Upload to Nexus Mods
        if: github.event_name == 'release'
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: ${{ steps.pkg.outputs.zip_path }}
          version: ${{ steps.pkg.outputs.version }}
          display_name: "${{ steps.pkg.outputs.display_name }} Support v${{ steps.pkg.outputs.version }}"
          description: Adds support for ${{ steps.pkg.outputs.display_name }} to Vortex
          category: main
          update_mod_version: true
